{% if session.steamid %}
  <span class="barra-acoes">
    <nav class="conta-nav">
      <a href="{{ url_for('trades.listar') }}"{% if request.endpoint == 'trades.listar' %} aria-current="page"{% endif %}>Trades</a>
      <a href="{{ url_for('watchlist.listar') }}"{% if request.endpoint == 'watchlist.listar' %} aria-current="page"{% endif %}>Watchlist</a>
      <a href="{{ url_for('history.listar') }}"{% if request.endpoint == 'history.listar' %} aria-current="page"{% endif %}>Histórico</a>
    </nav>
    <a class="conta-pill" href="{{ url_for('account.conta') }}" title="Minha conta"{% if request.endpoint == 'account.conta' %} aria-current="page"{% endif %}>
      {% if usuario and usuario.avatar_url %}
      <img class="conta-avatar" src="{{ usuario.avatar_url }}" alt="" width="24" height="24" loading="lazy">
      {% endif %}
      <span class="conta-nome">{{ usuario.persona_name if usuario and usuario.persona_name else "Minha conta" }}</span>
    </a>
    <a class="conta-sair" href="{{ url_for('account.logout') }}" title="Sair" aria-label="Sair">⏻</a>
  </span>
{% else %}
  <span class="entrar-cta">
    <a class="conta-link-entrar" href="{{ url_for('account.login') }}">Entrar com Steam</a>
    <span class="entrar-cta-legenda">Importe seu inventário e acompanhe portfólio, trades e watchlist</span>
  </span>
{% endif %}
