# Roda o site público localmente (ou num VPS) com Docker: web + worker
# compartilhando o mesmo volume de dados. Ver galaseca/public_site/README.md.
#
# Uso: docker compose -f docker-compose.public-site.yml up --build
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.public-site
    ports:
      - "8000:8000"
    volumes:
      - skinvault_data:/data
    restart: unless-stopped
    logging: &log-rotativo
      # Gunicorn/worker não rotacionam o próprio log -- escrevem em
      # stdout/stderr e o Docker guarda isso em disco sem limite por
      # padrão. 10MB x 3 arquivos é generoso pro volume deste site
      # (achado 2a rodada, 2026-10-25: nunca medido, mas o `errors.log`
      # da aplicação já rotaciona em 1MB -- o log do container merece o
      # mesmo cuidado).
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.public-site
    command: python -m galaseca.public_site.worker
    environment:
      - GALASECA_WORKER_INTERVAL_HORAS=6
    volumes:
      - skinvault_data:/data
    restart: unless-stopped
    logging: *log-rotativo

# NÃO renomear para galaseca_data: o nome do volume é a chave dos dados
# de produção (banco de contas, scans, chave de sessão). Um nome novo cria
# um volume vazio e o site perde tudo. Ficou com o nome antigo de propósito
# na troca SkinVault -> GalaSeca (2026-10-29), assim como a pasta ~/skinvault
# na VM, que define o nome do projeto Docker e, portanto, o dos volumes.
volumes:
  skinvault_data:
