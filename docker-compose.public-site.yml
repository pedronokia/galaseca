# Roda o site público localmente (ou num VPS) com Docker: web + worker
# compartilhando o mesmo volume de dados. Ver lodout/public_site/README.md.
#
# Uso: docker compose -f docker-compose.public-site.yml up --build
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.public-site
    ports:
      # 127.0.0.1, não 0.0.0.0 (achado de auditoria, skill docker-
      # security-guide, 2026-11-05): em produção (docker-compose.oracle.
      # yml) o Caddy já alcança este serviço pela rede interna do Docker
      # (`reverse_proxy web:8000` no Caddyfile, por nome de serviço, não
      # por porta publicada) -- publicar em 0.0.0.0 deixava qualquer um
      # na internet acessar o Flask cru na porta 8000, pulando TLS/HSTS/
      # CSP do Caddy inteiros. Continua acessível em localhost pra rodar
      # local sem Caddy (`http://127.0.0.1:8000`), só não mais de fora.
      - "127.0.0.1:8000:8000"
    environment:
      # Só pro /admin mostrar se os alertas do dono estão ligados (ver o
      # mesmo item no worker abaixo).
      - LODOUT_ADMIN_DISCORD_WEBHOOK=${LODOUT_ADMIN_DISCORD_WEBHOOK:-}
      # Senha do /admin (secret ADMIN_PASSWORD do GitHub, via deploy.yml);
      # vazia = /admin desligado (404). Nunca escrita aqui.
      - LODOUT_ADMIN_PASSWORD=${LODOUT_ADMIN_PASSWORD:-}
    volumes:
      - skinvault_data:/data
    restart: unless-stopped
    logging: &log-rotativo
      # Gunicorn/worker não rotacionam o próprio log -- escrevem em
      # stdout/stderr e o Docker guarda isso em disco sem limite por
      # padrão. 10MB x 3 arquivos é generoso pro volume deste site
      # (achado 2a rodada, 2026-10-25: nunca medido, mas o `errors.log`
      # da aplicação já rotaciona em 1MB -- o log do container merece o
      # mesmo cuidado).
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.public-site
    command: python -m lodout.public_site.worker
    # SIGTERM do deploy: o worker termina o item em curso e grava o
    # checkpoint (data/scan_parcial.json) antes de sair; um item pode
    # levar ~15 s de requisição + pausas, então 10 s (padrão) é curto.
    stop_grace_period: 40s
    environment:
      - LODOUT_WORKER_INTERVAL_HORAS=6
      # Alertas do dono (worker_alert.py). Vem do secret
      # ADMIN_DISCORD_WEBHOOK do GitHub via deploy.yml -- nunca escrito
      # aqui. Vazio = sem alerta.
      - LODOUT_ADMIN_DISCORD_WEBHOOK=${LODOUT_ADMIN_DISCORD_WEBHOOK:-}
    volumes:
      - skinvault_data:/data
    restart: unless-stopped
    logging: *log-rotativo

# NÃO renomear para lodout_data: o nome do volume é a chave dos dados
# de produção (banco de contas, scans, chave de sessão). Um nome novo cria
# um volume vazio e o site perde tudo. Ficou com o nome antigo de propósito
# nas trocas SkinVault -> GalaSeca (2026-10-29) e GalaSeca -> Lodout
# (2026-11-13), assim como a pasta ~/skinvault
# na VM, que define o nome do projeto Docker e, portanto, o dos volumes.
volumes:
  skinvault_data:
