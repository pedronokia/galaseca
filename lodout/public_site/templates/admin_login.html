<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Lodout</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="{{ static_v('favicon.svg') }}">
  <link rel="stylesheet" href="{{ static_v('style.css') }}">
</head>
<body>
  <a class="link-pular-conteudo" href="#conteudo">Pular pro conteúdo</a>
  <header class="topo">
    <div class="topo-linha">
      <p class="titulo-logo">{% include "partials/_logo.html" %}</p>
    </div>
  </header>

  <main id="conteudo" class="pagina-texto">
    <header class="cabecalho-pagina">
      <h1 class="titulo-pagina">Painel interno</h1>
      <p class="descricao-pagina">Acesso restrito ao dono do site. Digite a senha de admin para entrar no painel de operação.</p>
    </header>

    <div class="resumo-cards">
      <div class="card">
        <form class="form-adicionar" method="post" action="{{ url_for('admin_login') }}">
          <input type="password" name="senha" placeholder="Senha" aria-label="Senha" autofocus required{% if erro %} aria-invalid="true"{% endif %}>
          <button type="submit" class="botao-acao">Entrar</button>
        </form>
        {% if erro %}
          <p class="status valor-negativo" role="alert">{{ erro }}</p>
        {% endif %}
      </div>
    </div>
  </main>

  <footer class="rodape">
    <p class="versao">Lodout</p>
    {% include "partials/_rodape_links.html" %}
  </footer>
</body>
</html>
