{# _rotulos vem de base.html, compartilhado via contexto do include #}
<header class="breadcrumb">
  <span class="breadcrumb-path">
    <span class="breadcrumb-root">SkinVault</span>
    {%- if active in _rotulos %}
    <span class="breadcrumb-sep">/</span>
    <span class="breadcrumb-current">{{ _rotulos[active] }}</span>
    {%- endif %}
  </span>
  <span class="breadcrumb-right" id="breadcrumb-right"></span>
</header>
