{% extends "base.html" %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">{{ title }}</h1>
    <p class="muted">{{ message }}</p>
  </div>
</div>

<section id="error-empty" class="card">
  <p class="muted">{{ hint }}</p>
  <a href="/" class="btn-primary" style="display:inline-block;margin-top:var(--space-lg);text-decoration:none;">
    Voltar para o início
  </a>
</section>
{% endblock %}
