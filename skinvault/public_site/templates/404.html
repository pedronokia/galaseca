<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada — AlertaSkins</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ static_v('style.css') }}">
</head>
<body>
  <a class="link-pular-conteudo" href="#conteudo">Pular pro conteúdo</a>
  <header class="topo">
    <div class="topo-linha">
      <h1><a href="{{ url_for('index') }}" class="link-sutil">AlertaSkins</a></h1>
      {% include "partials/_conta_link.html" %}
    </div>
  </header>

  <main id="conteudo" class="pagina-texto">
    <h2 class="secao-titulo">Essa página não existe</h2>
    <p>O link pode estar errado, ou a página pode ter sido removida.
    Se procurava um item, tenta buscar direto:</p>
    <form class="form-filtros" method="get" action="{{ url_for('index') }}">
      <label>Buscar
        <input type="text" name="q" placeholder="Nome do item">
      </label>
      <button type="submit">Buscar</button>
    </form>
    <p><a href="{{ url_for('index') }}">← Voltar pro dashboard</a></p>
  </main>

  <footer class="rodape">
    {% include "partials/_rodape_links.html" %}
  </footer>
</body>
</html>
