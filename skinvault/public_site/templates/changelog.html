<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mudanças — SkinVault</title>
  <meta name="description" content="O que mudou no SkinVault, por data.">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon.svg') }}">
  <meta name="theme-color" content="#171a21">
  <link rel="alternate" type="application/rss+xml" title="SkinVault — Recomendações" href="{{ url_for('feed') }}">
  <link rel="stylesheet" href="{{ static_v('style.css') }}">
</head>
<body>
  <header class="topo">
    <div class="topo-linha">
      <h1><a href="{{ url_for('index') }}" class="link-sutil">SkinVault</a></h1>
      {% include "partials/_conta_link.html" %}
    </div>
    <p class="subtitulo">O que mudou no site, por data.</p>
  </header>

  <main class="pagina-texto">
    {% for entrada in entradas %}
    <h2 class="secao-titulo">{{ entrada.data }} — {{ entrada.titulo }}</h2>
    <ul>
      {% for item in entrada.itens %}
      <li>{{ item }}</li>
      {% endfor %}
    </ul>
    {% endfor %}
  </main>

  <footer class="rodape">
    {% include "partials/_rodape_links.html" %}
  </footer>
</body>
</html>
