<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — AlertaSkins</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ static_v('style.css') }}">
</head>
<body>
  <a class="link-pular-conteudo" href="#conteudo">Pular pro conteúdo</a>
  <header class="topo">
    <div class="topo-linha">
      <h1><a href="{{ url_for('index') }}" class="link-sutil">AlertaSkins</a></h1>
    </div>
    <p class="subtitulo">Painel interno — login.</p>
  </header>

  <main id="conteudo" class="pagina-texto">
    <form class="form-adicionar" method="post" action="{{ url_for('admin_login') }}">
      <input type="password" name="senha" placeholder="Senha" aria-label="Senha" autofocus required>
      <button type="submit">Entrar</button>
    </form>
    {% if erro %}
      <p class="status valor-negativo">{{ erro }}</p>
    {% endif %}
  </main>
</body>
</html>
