name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      atualizar_baselines:
        description: "Regerar as imagens-base da regressão visual (baixar o artefato visual-baselines e commitar os PNGs)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Era ["3.9", "3.12"] -- 3.9 caiu em 2026-11-05 junto com a troca
        # de Pillow (ver requirements-public-site.txt e Dockerfile.
        # public-site): o fix das 73 CVEs do Pillow 11.3.0 exige Python
        # >=3.10, e 3.12 já era testado aqui, sem introduzir versão nova.
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-public-site.txt
      - run: python -m pip install -r requirements-public-site.txt pytest
      # Publica cada FAILED/ERROR como anotação do job: o resumo da
      # execução mostra o motivo sem precisar abrir (nem baixar) o log.
      - name: python -m pytest -q
        shell: bash
        run: |
          set +e
          python -m pytest -q -rfE 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR) " pytest.log | head -30 | while IFS= read -r linha; do
            echo "::error title=pytest::${linha}"
          done
          exit "$status"

  # Regressão visual (2026-11-12): captura as telas principais com
  # Playwright num dataset fixo e compara com as imagens-base em
  # tests/visual/baseline/. Base é gerada SÓ aqui (Linux) -- no Windows
  # a pilha de fontes é outra. Qualquer mudança de layout além da
  # tolerância por pixel falha o job; regerar a base é um commit
  # explícito (workflow_dispatch com atualizar_baselines).
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-public-site.txt
      - run: python -m pip install -r requirements-public-site.txt -r tests/visual/requirements.txt
      - name: Instala o Chromium do Playwright
        run: python -m playwright install --with-deps chromium
      - name: Captura e compara as telas
        shell: bash
        run: |
          flags=""
          if [ "${{ inputs.atualizar_baselines }}" = "true" ]; then
            flags="--atualizar"
          fi
          python tests/visual/visual_regression.py $flags
      - name: Falha se as imagens-base mudaram sem commit novo
        if: ${{ inputs.atualizar_baselines != true }}
        shell: bash
        run: |
          status=$(git status --porcelain tests/visual/baseline)
          modificados=$(printf '%s\n' "$status" | grep -E '^(M| M|AM|MM)' || true)
          if [ -n "$modificados" ]; then
            echo "::error::As imagens-base mudaram neste run -- a captura divergiu da base comitada. Se a mudança é de propósito, regere a base (workflow_dispatch com atualizar_baselines) e commite os PNGs do artefato visual-baselines."
            printf '%s\n' "$modificados"
            exit 1
          fi
          novos=$(printf '%s\n' "$status" | grep -E '^\?\?' || true)
          if [ -n "$novos" ]; then
            echo "::warning::Imagens-base novas (nunca commitadas):"
            printf '%s\n' "$novos"
          fi
      - name: Sobe as imagens-base (regerar / baixar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/visual/baseline/
      - name: Sobe as capturas e os diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            tests/visual/current/
            tests/visual/diff/

  pip-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r requirements-public-site.txt
