name: deploy

# Roda só DEPOIS que o workflow "tests" (tests.yml) passar em push pra
# main -- nunca deploya código que não passou na suite. Pedido do
# usuário (2026-10-25): até aqui, todo deploy era manual (scp + ssh +
# docker compose). Precisa de 3 secrets no repositório (Settings →
# Secrets and variables → Actions), que só o dono pode configurar --
# a chave privada nunca deve ser colada em lugar nenhum além do campo
# de secret do próprio GitHub:
#   ORACLE_HOST       -- IP ou domínio da VM (ex. pedronokia.duckdns.org)
#   ORACLE_SSH_KEY     -- conteúdo do arquivo .key baixado na criação da VM
#   SITE_DOMAIN        -- mesmo valor usado hoje no deploy manual
on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH na VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: opc
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ~/skinvault
            # fetch + reset --hard (nunca "pull"): um merge imprevisível
            # se o checkout da VM tiver divergido (já aconteceu com scp
            # manual) é pior que simplesmente igualar a origin/main --
            # mesma lição já aplicada no fluxo de deploy manual.
            git fetch origin
            git reset --hard origin/main
            git clean -fd
            # Só "web". O worker NÃO pega o código novo sozinho -- é um
            # processo de longa duração (`while True` em worker.main) numa
            # imagem que só é reconstruída com [restart-worker] no commit.
            # Desde 2026-10-29 o worker espera o próximo ciclo ao subir
            # (`espera_ate_proximo_ciclo`), então reiniciá-lo fora de um
            # scan não custa requisição; reiniciar NO MEIO de um scan
            # ainda interrompe a coleta, por isso continua opt-in.
            SITE_DOMAIN=${{ secrets.SITE_DOMAIN }} sudo -E docker compose \
              -f docker-compose.public-site.yml -f docker-compose.oracle.yml \
              up --build -d web

      - name: Confirma que o site subiu (2a rodada, 2026-10-26)
        run: |
          sleep 5
          curl -sf "https://${{ secrets.SITE_DOMAIN }}/healthz" | grep -q '"ok": *true' \
            && echo "OK: /healthz respondeu" \
            || (echo "FALHOU: /healthz não respondeu como esperado" && exit 1)

      - name: Atualiza o worker quando o commit solicitar
        if: ${{ contains(github.event.workflow_run.head_commit.message, '[restart-worker]') }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: opc
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ~/skinvault
            # Ao subir, o worker espera o próximo ciclo (conta do último
            # registrado); só escaneia na hora se o ciclo já estiver atrasado.
            SITE_DOMAIN=${{ secrets.SITE_DOMAIN }} sudo -E docker compose \
              -f docker-compose.public-site.yml -f docker-compose.oracle.yml \
              up --build -d worker
