name: deploy

# Roda só DEPOIS que o workflow "tests" (tests.yml) passar em push pra
# main -- nunca deploya código que não passou na suite. Pedido do
# usuário (2026-10-25): até aqui, todo deploy era manual (scp + ssh +
# docker compose). Precisa de 3 secrets no repositório (Settings →
# Secrets and variables → Actions), que só o dono pode configurar --
# a chave privada nunca deve ser colada em lugar nenhum além do campo
# de secret do próprio GitHub:
#   ORACLE_HOST       -- IP ou domínio da VM (ex. pedronokia.duckdns.org)
#   ORACLE_SSH_KEY     -- conteúdo do arquivo .key baixado na criação da VM
#   SITE_DOMAIN        -- mesmo valor usado hoje no deploy manual
# Opcional:
#   ADMIN_DISCORD_WEBHOOK -- URL do webhook do Discord do DONO pros
#                            alertas do worker (atraso, scan degradado,
#                            disco). Sem ele, os alertas ficam desligados.
on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    # `event == 'push'`: o workflow de tests também roda a pedido
    # (workflow_dispatch, pra regerar as imagens-base da regressão
    # visual) -- um run manual bem-sucedido NÃO é deploy.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH na VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: opc
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ~/skinvault
            # fetch + reset --hard (nunca "pull"): um merge imprevisível
            # se o checkout da VM tiver divergido (já aconteceu com scp
            # manual) é pior que simplesmente igualar a origin/main --
            # mesma lição já aplicada no fluxo de deploy manual.
            git fetch origin
            git reset --hard origin/main
            git clean -fd
            # Só "web". O worker NÃO pega o código novo sozinho -- é um
            # processo de longa duração (`while True` em worker.main) numa
            # imagem que só é reconstruída com [restart-worker] no commit.
            # Desde 2026-10-29 o worker espera o próximo ciclo ao subir
            # (`espera_ate_proximo_ciclo`), então reiniciá-lo fora de um
            # scan não custa requisição; desde 2026-11-13 reiniciar NO
            # MEIO de um scan retoma do checkpoint (data/scan_parcial.json)
            # em vez de perder a coleta, mas segue opt-in.
            SITE_DOMAIN=${{ secrets.SITE_DOMAIN }} \
              LODOUT_ADMIN_DISCORD_WEBHOOK='${{ secrets.ADMIN_DISCORD_WEBHOOK }}' \
              sudo -E docker compose \
              -f docker-compose.public-site.yml -f docker-compose.oracle.yml \
              up --build -d web

      # Antes da checagem abaixo: ela bate no domínio que o Caddy novo serve.
      - name: Recria o Caddy quando o commit solicitar
        if: ${{ contains(github.event.workflow_run.head_commit.message, '[restart-caddy]') }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: opc
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ~/skinvault
            # `caddy reload` já reportou sucesso sem aplicar mudança de
            # cabeçalho; recriar o container relê o Caddyfile com certeza.
            SITE_DOMAIN=${{ secrets.SITE_DOMAIN }} \
              LODOUT_ADMIN_DISCORD_WEBHOOK='${{ secrets.ADMIN_DISCORD_WEBHOOK }}' \
              sudo -E docker compose \
              -f docker-compose.public-site.yml -f docker-compose.oracle.yml \
              up -d --force-recreate caddy

      - name: Confirma que o site subiu (2a rodada, 2026-10-26)
        run: |
          # Até ~60s: no primeiro deploy de um domínio o Caddy ainda está
          # emitindo o certificado quando esta checagem começa.
          for i in $(seq 1 12); do
            sleep 5
            if curl -sf "https://lodout.com/healthz" | grep -q '"ok": *true'; then
              echo "OK: /healthz respondeu"; exit 0
            fi
          done
          echo "FALHOU: /healthz não respondeu como esperado"; exit 1

      - name: Atualiza o worker quando o commit solicitar
        if: ${{ contains(github.event.workflow_run.head_commit.message, '[restart-worker]') }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: opc
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd ~/skinvault
            # Ao subir, o worker espera o próximo ciclo (conta do último
            # registrado); só escaneia na hora se o ciclo já estiver atrasado.
            SITE_DOMAIN=${{ secrets.SITE_DOMAIN }} \
              LODOUT_ADMIN_DISCORD_WEBHOOK='${{ secrets.ADMIN_DISCORD_WEBHOOK }}' \
              sudo -E docker compose \
              -f docker-compose.public-site.yml -f docker-compose.oracle.yml \
              up --build -d worker
