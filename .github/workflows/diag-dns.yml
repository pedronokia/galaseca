name: diag-dns

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: DNS do galaseca.com (hardcoded)
        run: |
          echo "=== getaddrinfo ==="
          python -c "import socket; print(socket.getaddrinfo('galaseca.com', 443))"
          echo "=== check_tls_expiry hardcoded ==="
          python scripts/check_tls_expiry.py galaseca.com 14
